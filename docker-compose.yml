services:

  # ─────────────────────────────────────────────
  # PHP 8.2 + Laravel 11 — Auth Service
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: auth-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
      - app_keys:/var/www/storage/keys   # RSA keys — never in git
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-net
    command: php artisan serve --host=0.0.0.0 --port=8000

  # ─────────────────────────────────────────────
  # MySQL 8 — pharmacy_auth database
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    command: --log_bin_trust_function_creators=1
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: pharmacy_auth
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth-net

  # ─────────────────────────────────────────────
  # Redis 7 — JTI blacklist + cache + queues
  # Option B from prompt (recommended VPS stack)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth-net

  # ─────────────────────────────────────────────
  # Queue worker — processes async jobs
  # Enabled only when QUEUE_CONNECTION=redis
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: auth-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app_keys:/var/www/storage/keys
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth-net
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

volumes:
  mysql_data:
  redis_data:
  app_keys:

networks:
  auth-net:
    driver: bridge
