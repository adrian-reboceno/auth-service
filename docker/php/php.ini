; ─────────────────────────────────────────────────────────────────────
; Auth Service — PHP 8.2 runtime configuration
; ─────────────────────────────────────────────────────────────────────

[PHP]
; Error reporting — verbose in development
error_reporting  = E_ALL
display_errors   = On
log_errors       = On
error_log        = /var/www/storage/logs/php_errors.log

; Limits
memory_limit        = 256M
max_execution_time  = 60
post_max_size       = 16M
upload_max_filesize = 16M

; Timezone — matches pharmacy locale (adjust if needed)
date.timezone = America/Mexico_City

; OPcache — disabled in development, enable in production
opcache.enable = 0

; Session
session.gc_maxlifetime = 3600

[bcrypt]
; Cost 12 as required by prompt Business Rule #12
; PHP's password_hash() reads this automatically when using PASSWORD_BCRYPT
; Set here as documentation — actual cost is enforced in BcryptHasher.php
